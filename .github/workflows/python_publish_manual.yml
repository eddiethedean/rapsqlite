name: Python publish (manual)

on:
  workflow_dispatch:
    inputs:
      publish-crate:
        description: "Also publish Rust crate to crates.io (no-op for rapsqlite)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  pypi-manylinux-x86_64:
    name: PyPI manylinux (x86_64) + sdist (manual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to PyPI (manylinux x86_64 + sdist)
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: x86_64-unknown-linux-gnu
          command: publish
          args: --zig -i 3.10 -i 3.11 -i 3.12 -i 3.13 -i 3.14 --skip-existing
          manylinux: "2_17"
          container: off

  pypi-manylinux-aarch64:
    name: PyPI manylinux (aarch64) (manual)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Publish to PyPI (manylinux aarch64)
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: aarch64-unknown-linux-gnu
          command: publish
          args: --zig -i 3.10 -i 3.11 -i 3.12 -i 3.13 -i 3.14 --skip-existing
          manylinux: "2_28"
          container: off

  pypi-musllinux-x86_64:
    name: PyPI musllinux (x86_64) (manual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to PyPI (musllinux x86_64)
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: x86_64-unknown-linux-musl
          command: publish
          args: --zig --compatibility musllinux_1_2 -i 3.10 -i 3.11 -i 3.12 -i 3.13 -i 3.14 --skip-existing

  pypi-musllinux-aarch64:
    name: PyPI musllinux (aarch64) (manual)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Publish to PyPI (musllinux aarch64)
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: aarch64-unknown-linux-musl
          command: publish
          args: --zig --compatibility musllinux_1_2 -i 3.10 -i 3.11 -i 3.12 -i 3.13 -i 3.14 --skip-existing

  pypi-mac:
    name: PyPI macOS (${{ matrix.target }}) (manual)
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - name: Publish to PyPI (macOS)
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: ${{ matrix.target }}
          command: publish
          args: -i 3.10 -i 3.11 -i 3.12 -i 3.13 -i 3.14 --skip-existing
