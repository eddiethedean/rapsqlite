[package]
name = "rapsqlite"
version = "0.3.2"
edition = "2021"
authors = ["RAP Project"]
description = "True async SQLite — no fake async, no GIL stalls."
repository = "https://github.com/eddiethedean/rapsqlite"
license = "MIT"

[lib]
name = "rapsqlite"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1.11.1"  # RUSTSEC-2026-0007: bytes 1.11.0 overflow
pyo3 = { version = "0.27" }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], default-features = false }
libsqlite3-sys = "0.30"

[features]
extension-module = ["pyo3/extension-module"]
abi3-py310 = ["pyo3/abi3-py310"]
default = ["extension-module", "abi3-py310"]

